name: Prove rebuilt CV baseline guardrails once

on:
  push:
    branches:
      - test/130-lock-spanish-cv-baseline-v2

permissions:
  contents: write

jobs:
  prove:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: test/130-lock-spanish-cv-baseline-v2

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -f \
            /etc/apt/sources.list.d/google-chrome.list \
            /etc/apt/sources.list.d/google-chrome.sources
          npx playwright install --with-deps chromium

      - name: Format guard and prove clean baseline
        run: |
          set -euo pipefail
          npx prettier tests/cv-baseline.spec.ts --write
          CI= npx playwright test \
            tests/cv-baseline.spec.ts \
            tests/cv-accessibility.spec.ts \
            tests/cv-content.spec.ts

      - name: Prove A4 geometry mutation is rejected
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('public/cv/styles.css')
          text = path.read_text()
          old = '    width: 210mm;\n    height: 297mm;'
          assert text.count(old) >= 1
          path.write_text(text.replace(old, '    width: 200mm;\n    height: 297mm;', 1))
          PY
          if CI= npx playwright test tests/cv-baseline.spec.ts --grep "A4 geometry"; then
            echo "A4 mutation unexpectedly passed"
            exit 1
          fi
          git checkout -- public/cv/styles.css

      - name: Prove mobile fluid-width mutation is rejected
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('public/cv/styles.css')
          text = path.read_text()
          pattern = r'(@media screen and \(max-width:\s*700px\)[\s\S]*?\.cv-sheet\s*\{[\s\S]*?)width:\s*100%;'
          mutated, count = re.subn(pattern, r'\1width: 210mm;', text, count=1)
          assert count == 1
          path.write_text(mutated)
          PY
          if CI= npx playwright test tests/cv-baseline.spec.ts --grep "390px mobile baseline"; then
            echo "Mobile mutation unexpectedly passed"
            exit 1
          fi
          git checkout -- public/cv/styles.css

      - name: Prove exporter destination mutation is rejected
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/export-cv.mjs')
          text = path.read_text()
          old = "'CV-Daniel-Garcia-Ortega.pdf'"
          assert text.count(old) == 1
          path.write_text(text.replace(old, "'broken-cv.pdf'", 1))
          PY
          if CI= npx playwright test tests/cv-baseline.spec.ts --grep "exporter and stylesheet"; then
            echo "Exporter mutation unexpectedly passed"
            exit 1
          fi
          git checkout -- scripts/export-cv.mjs

      - name: Prove corrected technology mutation is rejected
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('public/cv/index.html')
          text = path.read_text()
          old = '<span>Prisma</span>'
          assert text.count(old) == 1
          path.write_text(text.replace(old, '<span>Vercel</span>', 1))
          PY
          if CI= npx playwright test tests/cv-content.spec.ts; then
            echo "Technology mutation unexpectedly passed"
            exit 1
          fi
          git checkout -- public/cv/index.html

      - name: Verify workspace restored
        run: |
          set -euo pipefail
          git diff -- public/cv/index.html public/cv/styles.css scripts/export-cv.mjs
          test -z "$(git status --short public/cv/index.html public/cv/styles.css scripts/export-cv.mjs)"
          npx prettier tests/cv-baseline.spec.ts --check

      - name: Commit only maintained formatted guard
        run: |
          set -euo pipefail
          git rm .github/workflows/prove-cv-baseline-130-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/cv-baseline.spec.ts
          git diff --cached --check
          git commit -m "test: finalize Spanish CV baseline guardrails"
          git push origin HEAD:test/130-lock-spanish-cv-baseline-v2
