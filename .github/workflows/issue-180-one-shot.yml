name: Issue 180 one-shot cleanup

on:
  push:
    branches:
      - chore/180-remove-obsolete-project-preview-css

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: chore/180-remove-obsolete-project-preview-css

      - name: Remove only the retired selector family
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/styles/global.css')
          css = path.read_text(encoding='utf-8')

          base_pattern = re.compile(
              r"\n\.project-preview__open \{.*?\n\}\n\n"
              r"\.project-preview__open svg \{.*?\n\}\n\n"
              r"\.project-preview__open:hover \{.*?\n\}\n",
              re.S,
          )
          css, base_count = base_pattern.subn('\n', css)
          if base_count != 1:
              raise SystemExit(f'Expected one legacy base selector family, found {base_count}')

          breakpoint_pattern = re.compile(
              r"\n  \.project-preview__open \{\n"
              r"    display: (?:none|grid);\n"
              r"  \}\n"
          )
          css, breakpoint_count = breakpoint_pattern.subn('\n', css)
          if breakpoint_count != 3:
              raise SystemExit(
                  f'Expected three legacy breakpoint overrides, found {breakpoint_count}'
              )

          forced_colors = '  .project-preview__open,\n'
          if css.count(forced_colors) != 1:
              raise SystemExit('Expected one forced-colors legacy selector entry')
          css = css.replace(forced_colors, '')

          if 'project-preview__open' in css:
              raise SystemExit('Legacy selector residue remains after targeted cleanup')
          if '.project-preview__button' not in css or '.project-preview__arrow' not in css:
              raise SystemExit('Current project preview selectors were unexpectedly removed')

          path.write_text(css, encoding='utf-8')

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format maintained files
        run: npx prettier src/styles/global.css tests/project-preview-css-residue.spec.ts --write

      - name: Run focused regression guard
        run: npx playwright test tests/project-preview-css-residue.spec.ts

      - name: Verify scoped diff and retire this workflow
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git rm .github/workflows/issue-180-one-shot.yml

          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/issue-180-one-shot.yml' \
            'src/styles/global.css' \
            'tests/project-preview-css-residue.spec.ts' | sort)"

          if [ "$changed" != "$expected" ]; then
            echo "Unexpected issue #180 worktree diff:"
            git status --short
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/styles/global.css tests/project-preview-css-residue.spec.ts
          git commit -m 'style: remove obsolete project preview CSS'
          git push origin HEAD:chore/180-remove-obsolete-project-preview-css
