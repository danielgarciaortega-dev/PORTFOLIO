name: Verify bilingual CV HTML once

on:
  push:
    branches:
      - feat/131-bilingual-cv-html

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/131-bilingual-cv-html

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build bilingual HTML sources
        run: |
          node scripts/prepare-cv-131.mjs
          node scripts/link-cv-locale-assets-131.mjs
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const path = 'tests/cv-locales.spec.ts';
          let source = await readFile(path, 'utf8');
          const original = source;
          source = source.replace(
            "document.querySelectorAll('.education-item time'),\n    ).map((node) => node.textContent?.trim()),",
            "document.querySelectorAll('.education-item time'),\n    ).map((node) => node.getAttribute('datetime')),"," 
          );
          source = source.replace(
            "await expect(page.getByText(/409 issue groups/)).toBeVisible();",
            "await expect(page.locator('body')).toContainText('409 issue groups');",
          );
          source = source.replace(
            "await expect(page.getByText(/108 prioritized actions/)).toBeVisible();",
            "await expect(page.locator('body')).toContainText('108 prioritized actions');",
          );
          if (source === original) throw new Error('Expected CV parity test corrections were not applied');
          await writeFile(path, source, 'utf8');
          NODE
          npx prettier public/cv/index.html public/en/cv/index.html public/cv/locale.js public/cv/locale-controls.css src/components/layout/Header.astro tests/cv-locales.spec.ts --write

      - name: Install Chromium
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          npx playwright install --with-deps chromium

      - name: Verify bilingual CV and Spanish baseline
        run: |
          npm run build
          npx playwright test tests/cv-locales.spec.ts tests/cv-baseline.spec.ts tests/cv-accessibility.spec.ts tests/cv-content.spec.ts

      - name: Commit maintained files only
        run: |
          rm scripts/prepare-cv-131.mjs scripts/link-cv-locale-assets-131.mjs .github/workflows/build-cv-en-131.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add bilingual static CV HTML"
          git push origin HEAD:feat/131-bilingual-cv-html
