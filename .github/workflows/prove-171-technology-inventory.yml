name: Prove issue 171 technology inventory

on:
  push:
    branches:
      - feat/171-prioritize-home-technology-inventory

permissions:
  contents: write

jobs:
  prove:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/171-prioritize-home-technology-inventory

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Replace obsolete count-only contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          portfolio = Path('tests/portfolio.spec.ts')
          source = portfolio.read_text()
          count_contract = "await expect(technologyItems).toHaveCount(22);"
          icon_contract = "await expect(technologyItems.locator('img')).toHaveCount(22);"
          if source.count(count_contract) != 1 or source.count(icon_contract) != 1:
              raise SystemExit('Portfolio technology contract is not in the expected pre-#171 state')
          expected = """const expectedTechnologies = [
              'HTML5',
              'CSS3',
              'JavaScript',
              'TypeScript',
              'React',
              'Angular',
              'Next.js',
              'Java',
              'Python',
              'FastAPI',
              'Node.js',
              'Laravel/PHP',
              'APIs REST',
              'SQL',
              'PostgreSQL',
              'MySQL/MariaDB',
              'BigQuery',
              'Git',
              'Docker',
            ];
            await expect(technologyItems).toHaveCount(expectedTechnologies.length);"""
          source = source.replace(count_contract, expected, 1)
          source = source.replace(
              icon_contract,
              "await expect(technologyItems.locator('span')).toHaveText(expectedTechnologies);\n  await expect(technologyItems.locator('img')).toHaveCount(expectedTechnologies.length);\n  await expect(page.locator('.home-overview__technologies')).not.toContainText('GitHub');",
              1,
          )
          portfolio.write_text(source)

          home_locales = Path('tests/home-locales.spec.ts')
          source = home_locales.read_text()
          count_contract = ").toHaveCount(22);"
          if source.count(count_contract) != 1:
              raise SystemExit(f'Expected exactly one home-locales 22-count contract, found {source.count(count_contract)}')
          home_locales.write_text(source.replace(count_contract, ").toHaveCount(19);", 1))
          PY

      - name: Format maintained files
        run: >-
          npx prettier README.md src/data/es/technologies.ts src/data/en/technologies.ts
          src/data/technology-icons.ts tests/technology-icons.test.mjs
          tests/professional-overview-english.spec.ts tests/portfolio.spec.ts
          tests/home-locales.spec.ts --write

      - name: Run focused data and overview regressions
        run: |
          npm run test:locale
          npx playwright install --with-deps chromium
          npx playwright test tests/professional-overview-english.spec.ts tests/portfolio.spec.ts tests/home-locales.spec.ts

      - name: Run full repository test suite
        run: npm test

      - name: Verify scope and retire proof workflow
        run: |
          set -euo pipefail
          git diff --check
          git rm .github/workflows/prove-171-technology-inventory.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md src/data/es/technologies.ts src/data/en/technologies.ts src/data/technology-icons.ts public/images/technologies/angular.svg public/images/technologies/laravel.svg tests/technology-icons.test.mjs tests/professional-overview-english.spec.ts tests/portfolio.spec.ts tests/home-locales.spec.ts

          allowed='^(.github/workflows/prove-171-technology-inventory.yml|README.md|src/data/es/technologies.ts|src/data/en/technologies.ts|src/data/technology-icons.ts|public/images/technologies/angular.svg|public/images/technologies/laravel.svg|tests/technology-icons.test.mjs|tests/professional-overview-english.spec.ts|tests/portfolio.spec.ts|tests/home-locales.spec.ts)$'
          unexpected="$(git status --short | awk '{print $2}' | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected issue #171 worktree paths:'
            echo "$unexpected"
            exit 1
          fi

          git commit -m 'test: finalize prioritized technology inventory'
          git push origin HEAD:feat/171-prioritize-home-technology-inventory
