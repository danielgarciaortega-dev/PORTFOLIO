name: Repair dependency lock

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair-lock:
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'chore/issue-30-final-audit'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v7
        with:
          ref: chore/issue-30-final-audit

      - name: Configure Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Repair vulnerable lock entries
        run: npm audit fix --package-lock-only

      - name: Commit repaired lock
        run: |
          set -euo pipefail

          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already clean."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: patch audited dependency lock"
          git push origin HEAD:chore/issue-30-final-audit
