name: One-shot issue 293 dependency refresh

on:
  push:
    branches: [chore/issue-293-security-refresh]

permissions:
  contents: write

jobs:
  refresh-lock:
    if: ${{ !contains(github.event.head_commit.message, '[security-lock-refresh]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout security branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: chore/issue-293-security-refresh

      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Refresh remediable lockfile dependencies
        shell: bash
        run: |
          set +e
          npm audit fix --package-lock-only --ignore-scripts
          audit_exit=$?
          set -e
          if [ "$audit_exit" -ne 0 ]; then
            echo "Audit fix exited $audit_exit; unpatched http-cache-semantics advisory remains tracked in #293."
            echo "This one-shot job only generates an updated lockfile; required repository CI remains unchanged."
          fi

      - name: Verify lockfile installs
        run: npm ci --ignore-scripts

      - name: Commit refreshed lockfile
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- package.json
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile update generated"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh remediable vulnerable dependencies [security-lock-refresh]"
          git push origin HEAD:chore/issue-293-security-refresh
