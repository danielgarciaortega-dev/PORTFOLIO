name: Inspect esbuild approval

on:
  push:
    branches: [chore/issue-37-esbuild-install-script]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Configure Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Refresh lock metadata and approve esbuild
        run: |
          set -euo pipefail
          npm install --package-lock-only
          npm approve-scripts esbuild
          echo '--- git diff --stat ---'
          git diff --stat
          echo '--- package.json / package-lock.json diff ---'
          git diff -- package.json package-lock.json
