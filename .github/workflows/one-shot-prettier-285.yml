name: One-shot ATS Prettier fix

on:
  push:
    branches: [feat/285-ats-separators]

permissions:
  contents: write

jobs:
  format-ats:
    if: ${{ !contains(github.event.head_commit.message, '[autoformat-285]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/285-ats-separators

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Format English ATS HTML
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx prettier public/en/cv/ats/index.html --write
          git diff --exit-code -- public/cv/ats/index.html public/cv/ats/styles.css tests/cv-ats-es.spec.ts
          if git diff --quiet -- public/en/cv/ats/index.html; then
            echo 'Expected a formatting change in English ATS HTML'
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/en/cv/ats/index.html
          git commit -m "style(cv-ats): format English ATS metadata [autoformat-285]"
          git push origin HEAD:feat/285-ats-separators
