name: Prove dual CV PDF export once

on:
  push:
    branches:
      - feat/132-dual-cv-pdf-export

permissions:
  contents: write

jobs:
  prove:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/132-dual-cv-pdf-export

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Integrate dual export boundary
        run: |
          node scripts/prepare-cv-132.mjs
          npx prettier scripts/prepare-cv-132.mjs scripts/export-cv.mjs scripts/lib/cv-export.mjs tests/cv-export-contract.test.mjs tests/cv-pdf-locales.spec.ts tests/cv-baseline.spec.ts public/en/cv/index.html package.json --write

      - name: Prove fail-closed contract with deterministic fixtures
        run: node --test tests/cv-export-contract.test.mjs

      - name: Install Chromium and PDF structural tooling
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          npx playwright install --with-deps chromium
          sudo apt-get install -y poppler-utils

      - name: Generate both canonical PDFs
        run: npm run export:cv

      - name: Verify real PDF structure without OCR
        run: |
          set -euo pipefail
          for pdf in \
            public/cv/CV-Daniel-Garcia-Ortega.pdf \
            public/en/cv/CV-Daniel-Garcia-Ortega-EN.pdf
          do
            test -s "$pdf"
            pdfinfo "$pdf" | grep -Eq '^Pages:[[:space:]]+1$'
            pdfinfo "$pdf" | grep -Eq '^Page size:.*A4'
          done

      - name: Prove stale canonical PDFs cannot mask missing locale sources
        run: |
          set -euo pipefail
          ES=public/cv/CV-Daniel-Garcia-Ortega.pdf
          EN=public/en/cv/CV-Daniel-Garcia-Ortega-EN.pdf
          ES_HASH=$(sha256sum "$ES" | cut -d' ' -f1)
          EN_HASH=$(sha256sum "$EN" | cut -d' ' -f1)

          mv public/en/cv/index.html public/en/cv/index.html.off
          if npm run export:cv; then
            echo 'English-source failure was incorrectly reported as success' >&2
            exit 1
          fi
          mv public/en/cv/index.html.off public/en/cv/index.html
          test "$ES_HASH" = "$(sha256sum "$ES" | cut -d' ' -f1)"
          test "$EN_HASH" = "$(sha256sum "$EN" | cut -d' ' -f1)"

          mv public/cv/index.html public/cv/index.html.off
          if npm run export:cv; then
            echo 'Spanish-source failure was incorrectly reported as success' >&2
            exit 1
          fi
          mv public/cv/index.html.off public/cv/index.html
          test "$ES_HASH" = "$(sha256sum "$ES" | cut -d' ' -f1)"
          test "$EN_HASH" = "$(sha256sum "$EN" | cut -d' ' -f1)"

      - name: Prove repeatability and no transient residue
        run: |
          set -euo pipefail
          npm run export:cv
          if find public/cv public/en/cv -type f \( -name '*.tmp' -o -name '*.bak' \) | grep -q .; then
            echo 'Transient CV export files remained after success' >&2
            exit 1
          fi

      - name: Run full repository validation
        run: npm test

      - name: Commit maintained implementation and canonical PDFs only
        run: |
          rm scripts/prepare-cv-132.mjs .github/workflows/build-cv-pdfs-132.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: generate deterministic locale CV PDFs"
          git push origin HEAD:feat/132-dual-cv-pdf-export
