name: Refresh corrected CV artifact

on:
  push:
    branches:
      - fix/138-remove-vercel-from-cv

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/138-remove-vercel-from-cv

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply exact CV content correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('public/cv/index.html')
          text = path.read_text(encoding='utf-8')

          json_old = '        "Prisma",\n        "Vercel"\n'
          json_new = '        "Prisma"\n'
          visible_old = '                            <span>Vercel</span>\n'

          if text.count(json_old) != 1:
              raise SystemExit('Expected exactly one CV JSON-LD Vercel claim')
          if text.count(visible_old) != 1:
              raise SystemExit('Expected exactly one visible CV Vercel chip')

          text = text.replace(json_old, json_new, 1)
          text = text.replace(visible_old, '', 1)

          if 'Vercel' in text:
              raise SystemExit('Unexpected Vercel residue remains in CV HTML')
          if text.count('<span>Prisma</span>') != 1:
              raise SystemExit('Prisma visible sentinel was not preserved exactly once')
          if text.count('"Prisma"') != 1:
              raise SystemExit('Prisma JSON-LD sentinel was not preserved exactly once')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -f \
            /etc/apt/sources.list.d/google-chrome.list \
            /etc/apt/sources.list.d/google-chrome.sources
          npx playwright install --with-deps chromium

      - name: Regenerate canonical Spanish PDF
        run: npm run export:cv

      - name: Verify corrected CV artifacts
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'Vercel' public/cv/index.html
          grep -q '<span>Prisma</span>' public/cv/index.html
          grep -q '"Prisma"' public/cv/index.html
          test -s public/cv/CV-Daniel-Garcia-Ortega.pdf

      - name: Commit corrected HTML and regenerated PDF
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/cv/index.html public/cv/CV-Daniel-Garcia-Ortega.pdf
          git rm .github/workflows/refresh-cv-138.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix: remove Vercel from CV technology claims'
          git push origin HEAD:fix/138-remove-vercel-from-cv
