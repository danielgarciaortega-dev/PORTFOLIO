name: Format final bilingual audit once

on:
  push:
    branches:
      - test/56-final-bilingual-audit

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: test/56-final-bilingual-audit

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format maintained audit file
        run: |
          npx prettier tests/final-bilingual-audit.spec.ts --write
          npx prettier tests/final-bilingual-audit.spec.ts --check

      - name: Commit formatted file and remove this one-shot
        run: |
          rm .github/workflows/format-final-bilingual-audit-56.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/final-bilingual-audit.spec.ts .github/workflows/format-final-bilingual-audit-56.yml
          git commit -m "style: format final bilingual audit"
          git push origin HEAD:test/56-final-bilingual-audit
