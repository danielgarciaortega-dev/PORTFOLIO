name: Format CV audit once

on:
  push:
    branches:
      - test/133-cv-final-audit

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: test/133-cv-final-audit

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format maintained audit files
        run: |
          npx prettier tests/cv-final-audit.spec.ts tests/cv-final-audit.test.mjs --write
          npx prettier tests/cv-final-audit.spec.ts tests/cv-final-audit.test.mjs --check

      - name: Commit formatted files and remove this one-shot
        run: |
          rm .github/workflows/format-cv-audit-133.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/cv-final-audit.spec.ts tests/cv-final-audit.test.mjs .github/workflows/format-cv-audit-133.yml
          git commit -m "style: format final CV audit tests"
          git push origin HEAD:test/133-cv-final-audit
