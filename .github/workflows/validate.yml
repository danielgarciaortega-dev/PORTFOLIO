name: Pull request validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Repository validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Validate generated assets
        run: npm run optimize:assets

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail

          # Playwright manages its own Chromium. The runner's unrelated Google
          # Chrome APT feed must not make CI depend on third-party metadata sync.
          sudo rm -f \
            /etc/apt/sources.list.d/google-chrome.list \
            /etc/apt/sources.list.d/google-chrome.sources

          npx playwright install --with-deps chromium

      - name: Validate CV export
        run: npm run export:cv

      - name: Run repository validation
        run: npm test

  preview:
    name: Preview readiness
    needs: quality
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      preview_url: ${{ steps.preview_readiness.outputs.preview_url }}
    steps:
      - name: Require repository validation
        env:
          REPOSITORY_VALIDATION_RESULT: ${{ needs.quality.result }}
        run: |
          if [ "$REPOSITORY_VALIDATION_RESULT" != "success" ]; then
            echo "Repository validation did not succeed for this pull-request run."
            exit 1
          fi

      - name: Checkout exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Validate exact-head Vercel Preview
        id: preview_readiness
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PREVIEW_WAIT_TIMEOUT_MS: '600000'
          PREVIEW_POLL_INTERVAL_MS: '5000'
        run: node scripts/preview-readiness.mjs

  visual_evidence:
    name: Preview visual evidence
    needs: preview
    if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.body, '- [x] Visual') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail

          sudo rm -f \
            /etc/apt/sources.list.d/google-chrome.list \
            /etc/apt/sources.list.d/google-chrome.sources

          npx playwright install --with-deps chromium

      - name: Capture exact-head Preview visual evidence
        env:
          PREVIEW_URL: ${{ needs.preview.outputs.preview_url }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/capture-preview-visual-evidence.mjs

      - name: Upload exact-head Preview visual evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-visual-evidence-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: artifacts/preview-visual-evidence/
          if-no-files-found: warn
          retention-days: 7

  format_diagnostics:
    name: Temporary format diagnostics
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 118 }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format only failing files
        run: >-
          npx prettier
          docs/operations/PREVIEW_AND_PAGES.md
          package.json
          scripts/capture-preview-visual-evidence.mjs
          scripts/lib/preview-visual-evidence.mjs
          scripts/preview-readiness.mjs
          tests/preview-readiness-workflow.test.mjs
          --write

      - name: Stage formatted artifact
        run: |
          mkdir -p format-diagnostics/docs/operations
          mkdir -p format-diagnostics/scripts/lib
          mkdir -p format-diagnostics/tests
          cp docs/operations/PREVIEW_AND_PAGES.md format-diagnostics/docs/operations/
          cp package.json format-diagnostics/
          cp scripts/capture-preview-visual-evidence.mjs format-diagnostics/scripts/
          cp scripts/lib/preview-visual-evidence.mjs format-diagnostics/scripts/lib/
          cp scripts/preview-readiness.mjs format-diagnostics/scripts/
          cp tests/preview-readiness-workflow.test.mjs format-diagnostics/tests/

      - name: Upload formatted sources
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: temporary-format-diagnostics-${{ github.event.pull_request.head.sha }}
          path: format-diagnostics/
          retention-days: 1
