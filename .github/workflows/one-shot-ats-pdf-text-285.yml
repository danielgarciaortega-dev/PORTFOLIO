name: One-shot ATS PDF text audit

on:
  push:
    branches: [feat/285-ats-separators]

permissions:
  contents: read

jobs:
  ats-pdf-text:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ATS branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          npx playwright install --with-deps chromium

      - name: Export all four CV PDFs
        run: npm run export:cv

      - name: Extract and audit ATS PDF text
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y poppler-utils
          fi
          for pdf in public/cv/ats/CV-Daniel-Garcia-Ortega-ATS.pdf public/en/cv/ats/CV-Daniel-Garcia-Ortega-ATS-EN.pdf; do
            pdftotext -layout "$pdf" "$pdf.txt"
            test -s "$pdf.txt"
            grep -Fq 'Konecta' "$pdf.txt"
            grep -Fq 'AL-LÍO' "$pdf.txt"
            grep -Fq '2023' "$pdf.txt"
            if grep -Fq '·' "$pdf.txt"; then
              echo "Unexpected fragile middle-dot separator in $pdf"
              exit 1
            fi
            if grep -Fq '�' "$pdf.txt"; then
              echo "Unexpected replacement glyph in $pdf"
              exit 1
            fi
            echo "Verified extracted text: $pdf"
            pdfinfo "$pdf" | grep '^Pages:'
          done
