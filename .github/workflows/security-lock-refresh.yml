name: One-shot dependency security refresh

on:
  push:
    branches: [chore/issue-44-security-refresh]

permissions:
  contents: write

jobs:
  refresh-lock:
    if: ${{ !contains(github.event.head_commit.message, '[security-lock-refresh]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout security branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: chore/issue-44-security-refresh

      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Refresh vulnerable lockfile entries
        run: npm audit fix --package-lock-only --ignore-scripts

      - name: Verify high-severity audit gate
        run: npm audit --audit-level=high

      - name: Commit refreshed lockfile
        run: |
          set -euo pipefail
          git diff --exit-code -- package.json || {
            echo "package.json changed unexpectedly"
            exit 1
          }
          if git diff --quiet -- package-lock.json; then
            echo "No package-lock.json changes produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh vulnerable dependencies [security-lock-refresh]"
          git push origin HEAD:chore/issue-44-security-refresh
